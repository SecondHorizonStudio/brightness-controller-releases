name: Bug report
description: Something misbehaves
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        The app keeps a timestamped diagnostic log at
        `~/Library/Logs/Brightness Controller.log` recording every change it
        made or observed and why. Pasting the lines from around the time it
        went wrong usually answers the question outright.
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What were you doing when it happened?
      description: >
        Waking from sleep, plugging in a monitor, closing the lid, calibrating?
        These transitions are where most bugs live.
  - type: input
    id: setup
    attributes:
      label: Mac model, macOS version, and app version
      placeholder: "MacBook Pro M3 Max, macOS 26.1, app 1.10.0"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Diagnostic log lines
      render: text
